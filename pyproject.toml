[project]
name = "streamlit-examples"
version = "0.1.0"
description = "Torben's Streamlit Examples and Snippets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chardet>=7.7.0",
    "msal>=1.39.0",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
    "xlsxwriter>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "tomli-w>=1.2.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]
